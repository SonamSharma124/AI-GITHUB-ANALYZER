<!DOCTYPE html>
<html>

<head>
<title>AI‑GitHub Analyzer</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0d1117;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
color:#e6edf3;
}

.container{
background:rgba(22,27,34,0.9);
padding:45px;
border-radius:18px;
width:850px;
box-shadow:0 15px 40px rgba(0,0,0,0.6);
}

h1{text-align:center;margin-bottom:10px;}

.subtitle{
text-align:center;
margin-bottom:30px;
color:#8b949e;
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #30363d;
background:#0d1117;
color:#e6edf3;
margin-bottom:12px;
}

input:focus{
outline:none;
border-color:#58a6ff;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#238636;
color:white;
cursor:pointer;
margin-bottom:10px;
}

button:hover{
background:#2ea043;
}

.card{
background:#161b22;
padding:15px;
border-radius:10px;
margin-bottom:12px;
border:1px solid #30363d;
}

.result, .answer{
margin-top:20px;
padding:20px;
background-color:#0d1117;
border:1px solid #30363d;
border-radius:10px;
}

.loading{text-align:center;}
.error{color:red;text-align:center;}

code{
background:#161b22;
padding:5px;
border-radius:5px;
color:#58a6ff;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 AI‑GitHub Analyzer</h1>
<p class="subtitle">Analyze any GitHub repository</p>

<input id="repo_url" placeholder="Paste GitHub repo URL">

<button onclick="analyze()">Analyze</button>
<button onclick="downloadReport()">Download Report</button>

<div id="loading" class="loading"></div>
<div id="error" class="error"></div>

<div id="result" class="result" style="display:none"></div>

<h3>💬 Ask about repo</h3>
<input id="question" placeholder="Ask something">
<button onclick="ask()">Ask</button>

<div id="answer" class="answer"></div>

<h3>🔎 Search Code</h3>
<input id="search_query" placeholder="Search keyword">
<button onclick="searchCode()">Search</button>

<div id="search_results" class="answer"></div>

</div>

<script>

// ANALYZE
async function analyze(){
try{
const repo = document.getElementById("repo_url").value;

document.getElementById("loading").innerHTML="Analyzing...";
document.getElementById("error").innerHTML="";
document.getElementById("result").style.display="none";

const form = new FormData();
form.append("repo_url", repo);

const res = await fetch("/analyze",{ method:"POST", body:form });
const data = await res.json();

document.getElementById("loading").innerHTML="";

if(data.error){
document.getElementById("error").innerHTML=data.error;
return;
}

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML = `
<div class="card"><b>Framework:</b> ${data.framework}</div>
<div class="card"><b>Project Type:</b> ${data.project_type}</div>
<div class="card"><b>Score:</b> ${data.score}</div>
<div class="card"><b>Summary:</b> ${data.summary}</div>
<div class="card">
Files: ${data.repo_stats.total_files}<br>
Folders: ${data.repo_stats.total_folders}<br>
Lines: ${data.repo_stats.total_lines}
</div>
${data.language_chart ? `<img src="/charts/${data.language_chart}" width="400">` : ""}
`;

}catch(err){
document.getElementById("loading").innerHTML="";
document.getElementById("error").innerHTML="Something went wrong!";
}
}

// ASK
async function ask(){
try{
const repo = document.getElementById("repo_url").value;
const question = document.getElementById("question").value;

const form = new FormData();
form.append("repo_url", repo);
form.append("question", question);

const res = await fetch("/ask",{ method:"POST", body:form });
const data = await res.json();

document.getElementById("answer").innerHTML = `
<b>Question:</b> ${data.question}<br><br>
<b>Answer:</b><br>${data.answer}
`;

}catch{
document.getElementById("answer").innerHTML="Error getting answer";
}
}

// SEARCH
async function searchCode(){
try{
const repo = document.getElementById("repo_url").value;
const query = document.getElementById("search_query").value;

const form = new FormData();
form.append("repo_url", repo);
form.append("query", query);

const res = await fetch("/search",{ method:"POST", body:form });
const data = await res.json();

let html = "";

if(data.results && data.results.length > 0){
data.results.forEach(r=>{
html += `
<div class="card">
${r.file} (Line ${r.line_number})<br>
<code>${r.code}</code>
</div>`;
});
}else{
html = "No results found";
}

document.getElementById("search_results").innerHTML = html;

}catch{
document.getElementById("search_results").innerHTML="Search error";
}
}

// DOWNLOAD
function downloadReport(){
const repo = document.getElementById("repo_url").value;
window.open(`/download?repo_url=${repo}`);
}

</script>

</body>
</html>
